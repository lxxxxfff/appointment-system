<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约登记系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 登录页面 -->
        <div id="loginPage" class="page">
            <div class="login-box">
                <h1>预约登记系统</h1>
                <div class="form-group">
                    <label for="username">请输入用户名：</label>
                    <input type="text" id="username" placeholder="输入您的用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">请输入密码：</label>
                    <input type="password" id="password" placeholder="输入您的密码" required>
                </div>
                <button class="btn btn-primary" onclick="login()">登录/注册</button>
            </div>
        </div>

        <!-- 预约页面 -->
        <div id="appointmentPage" class="page" style="display: none;">
            <div class="header">
                <h2>欢迎，<span id="currentUser"></span> <span id="userRole"></span> <span id="kingCrown" style="display: none;">👑</span></h2>
                <button class="btn btn-secondary" onclick="logout()">退出登录</button>
            </div>

            <!-- 平民预约区域 -->
            <div id="civilianSection">
                <div class="appointment-section">
                    <h3>新建预约</h3>
                    <div class="form-group">
                        <label for="appointmentDate">选择日期：</label>
                        <input type="date" id="appointmentDate" required>
                    </div>
                    <div class="form-group">
                        <label for="appointmentTime">选择时间段：</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="time" id="appointmentTimeStart" required min="00:00" max="23:59" style="flex: 1;">
                            <input type="time" id="appointmentTimeEnd" required min="00:00" max="23:59" style="flex: 1;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="appointmentReason">预约原因：</label>
                        <textarea id="appointmentReason" placeholder="请输入预约原因（可选）" rows="3"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="createAppointment()">确认预约</button>
                </div>

                <div class="appointments-list-section">
                    <h3>所有预约列表</h3>
                    <div class="filter-buttons">
                        <button class="btn-filter active" data-filter="all">全部</button>
                        <button class="btn-filter" data-filter="pending">待处理</button>
                        <button class="btn-filter" data-filter="accepted">已接受</button>
                        <button class="btn-filter" data-filter="ignored">不予理会</button>
                    </div>
                    <div id="appointmentsList"></div>
                    <div class="pagination" id="civilianPagination"></div>
                </div>
            </div>

            <!-- 小友管理区域 -->
            <div id="friendSection" style="display: none;">
                <div class="tab-buttons">
                    <button class="btn-tab active" data-tab="appointments">预约列表</button>
                    <button class="btn-tab" data-tab="logs">访问日志</button>
                </div>

                <!-- 预约列表标签页 -->
                <div id="appointmentsTab" class="tab-content">
                    <div class="appointments-list-section">
                        <h3>所有预约列表</h3>
                        <div class="filter-buttons">
                            <button class="btn-filter active" data-filter="all">全部</button>
                            <button class="btn-filter" data-filter="pending">待处理</button>
                            <button class="btn-filter" data-filter="accepted">已接受</button>
                            <button class="btn-filter" data-filter="ignored">不予理会</button>
                        </div>
                        <div id="allAppointmentsList"></div>
                        <div class="pagination" id="friendPagination"></div>
                    </div>
                </div>

                <!-- 访问日志标签页 -->
                <div id="logsTab" class="tab-content" style="display: none;">
                    <div class="appointments-list-section">
                        <h3>访问日志（最近100条）</h3>
                        <div id="accessLogsList"></div>
                    </div>
                </div>
            </div>

            <!-- 张爽大王管理区域 -->
            <div id="kingSection" style="display: none;">
                <div class="tab-buttons">
                    <button class="btn-tab active" data-tab="king-users">用户管理</button>
                    <button class="btn-tab" data-tab="king-logs">访问日志</button>
                </div>

                <!-- 用户管理标签页 -->
                <div id="king-usersTab" class="tab-content">
                    <div class="appointments-list-section">
                        <h3>用户管理</h3>
                        <div id="kingUsersList"></div>
                    </div>
                </div>

                <!-- 访问日志标签页 -->
                <div id="king-logsTab" class="tab-content" style="display: none;">
                    <div class="appointments-list-section">
                        <h3>访问日志（最近100条）</h3>
                        <div id="kingAccessLogsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=8"></script>
</body>
</html>
